apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizard-test-ingress 
  namespace: test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2 
spec:
  rules:
  - host: test.wizard.local
    http:
      paths:
      # 1. Backend API: /api/ ile başlayanları yakala
      - path: /api(/|$)(.*) 
        pathType: ImplementationSpecific 
        backend:
          service:
            name: backend-api-test-svc
            port:
              # Pod portu (8080) yerine Service portunu (80) kullanalım
              number: 80 
      # 2. MCP Server: /mcp/ ile başlayanları yakala
      - path: /mcp(/|$)(.*) 
        pathType: ImplementationSpecific 
        backend:
          service:
            name: mcp-server-test-svc
            port:
              # Pod portu (8081) yerine Service portunu (8081) kullanalım
              # (MCP Service'ini 8081 portunda oluşturmuştuk)
              number: 8081 
      # 3. Frontend: Diğer tüm yolları yakala
      - path: /()(.*) 
        pathType: ImplementationSpecific 
        backend:
          service:
            name: frontend-test-svc
            port:
              number: 80 

