apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizard-test-ingress 
  namespace: test
  annotations:
    # Sadece Nginx Ingress Controller'ı kullanacağımızı belirtiyoruz
    kubernetes.io/ingress.class: "nginx" 
    # Rewrite anotasyonu kaldırıldı
spec:
  rules:
  - host: test.wizard.local
    http:
      paths:
      # 1. Backend API: /api ile başlayan tüm istekleri yönlendirir
      #    İstek, backend'e /api/... olarak gider
      - path: /api
        pathType: Prefix 
        backend:
          service:
            name: backend-api-test-svc
            port:
              number: 80 
      # 2. MCP Server: /mcp ile başlayan tüm istekleri yönlendirir
      #    İstek, mcp'ye /mcp/... olarak gider
      - path: /mcp
        pathType: Prefix 
        backend:
          service:
            name: mcp-server-test-svc
            port:
              number: 8081 
      # 3. Frontend: Kök yola gelen istekleri yönlendirir
      #    Diğer tüm istekler de buraya düşebilir
      - path: /
        pathType: Prefix 
        backend:
          service:
            name: frontend-test-svc
            port:
              number: 80 

