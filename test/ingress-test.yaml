apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wizard-test-ingress 
  namespace: test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2 
spec:
  rules:
  - host: test.wizard.local
    http:
      paths:
      # 1. Backend API: /api/ ile başlayanları yakala
      - path: /api(/|$)(.*) 
        # pathType Prefix -> ImplementationSpecific olarak değiştirildi
        pathType: ImplementationSpecific 
        backend:
          service:
            name: backend-api-test-svc
            port:
              number: 8080 
      # 2. MCP Server: /mcp/ ile başlayanları yakala
      - path: /mcp(/|$)(.*) 
        # pathType Prefix -> ImplementationSpecific olarak değiştirildi
        pathType: ImplementationSpecific 
        backend:
          service:
            name: mcp-server-test-svc
            port:
              number: 8081 
      # 3. Frontend: Diğer tüm yolları yakala
      - path: /()(.*) 
        # pathType Prefix -> ImplementationSpecific olarak değiştirildi
        pathType: ImplementationSpecific 
        backend:
          service:
            name: frontend-test-svc
            port:
              number: 80 

