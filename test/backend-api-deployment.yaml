apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api-test
  template:
    metadata:
      labels:
        app: backend-api-test
    spec:
      containers:
      - name: backend-api
        # CI pipeline'ınız bu satırı güncelleyecek
        image: docker.io/omerfeyzioglu/projectwizard-backend-api:develop-9ea15a5
        ports:
        - containerPort: 8080 # .NET'in çalıştığı port